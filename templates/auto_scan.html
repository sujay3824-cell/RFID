<!DOCTYPE html>
<html>
<head>
    <title>RFID Scan — City Hospital</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif;
            background:radial-gradient(ellipse at top,#0d2137 0%,#080c14 70%);
            min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .top-bar { position:fixed; top:0; left:0; right:0;
            background:rgba(13,27,42,0.9); backdrop-filter:blur(10px);
            border-bottom:1px solid rgba(0,212,255,0.1);
            padding:14px 30px; display:flex; justify-content:space-between; align-items:center; z-index:100; }
        .brand { font-size:18px; font-weight:700; color:#00d4ff; }
        .back-btn { padding:6px 14px; background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.12); color:rgba(255,255,255,0.6);
            border-radius:8px; cursor:pointer; font-size:12px; font-family:inherit; }
        .scanner-wrap { text-align:center; padding:20px; }
        .pulse-ring { width:180px; height:180px; border-radius:50%;
            border:3px solid rgba(0,212,255,0.5);
            display:flex; align-items:center; justify-content:center;
            margin:0 auto 32px; position:relative; animation:pulse 2s infinite; }
        .pulse-ring::before, .pulse-ring::after { content:''; position:absolute;
            border-radius:50%; border:2px solid rgba(0,212,255,0.2); animation:ripple 2s infinite; }
        .pulse-ring::before { width:220px; height:220px; animation-delay:0.3s; }
        .pulse-ring::after  { width:260px; height:260px; animation-delay:0.6s; }
        @keyframes pulse  { 0%,100%{border-color:rgba(0,212,255,0.5);} 50%{border-color:rgba(0,212,255,1);} }
        @keyframes ripple { 0%{opacity:0.6;transform:scale(1);} 100%{opacity:0;transform:scale(1.3);} }
        .scan-icon     { font-size:64px; }
        .scan-title    { font-size:28px; font-weight:700; color:white; margin-bottom:10px; }
        .scan-subtitle { font-size:15px; color:rgba(255,255,255,0.4); margin-bottom:40px; }
        .status-box { background:rgba(0,212,255,0.06); border:1px solid rgba(0,212,255,0.15);
            border-radius:16px; padding:20px 30px; max-width:400px; margin:0 auto; }
        .status-dot { width:10px; height:10px; border-radius:50%; background:#38ef7d;
            display:inline-block; margin-right:8px; animation:blink 1s infinite; }
        @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
        .status-text { font-size:14px; color:rgba(255,255,255,0.7); }
        .scan-result { margin:24px auto 0; padding:20px 28px;
            background:rgba(56,239,125,0.08); border:1px solid rgba(56,239,125,0.25);
            border-radius:16px; max-width:400px; display:none; }
        .scan-result .user-name { font-size:22px; font-weight:700; color:#38ef7d; margin-bottom:6px; }
        .scan-result .user-role { font-size:14px; color:rgba(255,255,255,0.5); }
        .scan-result .redirect-msg { font-size:13px; color:rgba(255,255,255,0.4); margin-top:10px; }
        .error-box { margin:24px auto 0; padding:16px 24px;
            background:rgba(255,107,107,0.08); border:1px solid rgba(255,107,107,0.25);
            border-radius:16px; max-width:400px; color:#ff6b6b; font-size:14px; display:none; text-align:center; }
        .manual-link { margin-top:30px; font-size:13px; color:rgba(255,255,255,0.3); }
        .manual-link a { color:#00d4ff; text-decoration:none; }
        .clock { margin-top:30px; font-size:12px; color:rgba(255,255,255,0.2); }
    </style>
</head>
<body>
<div class="top-bar">
    <div class="brand">🏥 City Hospital — Auto Mode</div>
    <button class="back-btn" onclick="window.location.href='/mode'">← Back</button>
</div>
<div class="scanner-wrap">
    <div class="pulse-ring"><div class="scan-icon">📡</div></div>
    <div class="scan-title">Ready to Scan</div>
    <div class="scan-subtitle">Place your RFID card near the reader</div>
    <div class="status-box">
        <span class="status-dot"></span>
        <span class="status-text" id="status-text">Waiting for RFID card...</span>
    </div>
    <div class="scan-result" id="scan-result">
        <div class="user-name" id="result-name"></div>
        <div class="user-role" id="result-role"></div>
        <div class="redirect-msg">Opening dashboard in <span id="countdown">3</span> seconds...</div>
    </div>
    <div class="error-box" id="error-box">❌ RFID card not recognised. Please try again or use Manual mode.</div>
    <div class="manual-link">Card not working? <a href="/manual">Switch to Manual Mode</a></div>
    <div class="clock" id="clock"></div>
</div>
<script>
let lastScannedRfid = null;
let scanning = true;
setInterval(() => {
    fetch('/data').then(r => r.json()).then(data => {
        if (data.rfid && scanning) handleScan(data.rfid);
    });
}, 1500);
function handleScan(rfid) {
    scanning = false;
    document.getElementById('status-text').innerText = 'Processing card...';
    if (rfid === lastScannedRfid) {
        lastScannedRfid = null;
        document.getElementById('scan-result').style.display = 'none';
        document.getElementById('error-box').style.display   = 'none';
        document.getElementById('status-text').innerText = 'Session closed. Ready for next scan.';
        setTimeout(() => { document.getElementById('status-text').innerText = 'Waiting for RFID card...'; scanning = true; }, 2000);
        return;
    }
    fetch('/rfid_auto', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({rfid: rfid})
    })
    .then(r => r.json())
    .then(data => {
        if (data.status === 'ok') {
            lastScannedRfid = rfid;
            document.getElementById('result-name').innerText = '✅ ' + data.display_name;
            document.getElementById('result-role').innerText = data.role.toUpperCase() + ' · ' + data.staff_type;
            document.getElementById('scan-result').style.display = 'block';
            document.getElementById('error-box').style.display   = 'none';
            document.getElementById('status-text').innerText = 'Card recognised!';
            let count = 3;
            let timer = setInterval(() => {
                count--;
                document.getElementById('countdown').innerText = count;
                if (count <= 0) { clearInterval(timer); window.location.href = data.redirect; }
            }, 1000);
        } else {
            document.getElementById('error-box').style.display = 'block';
            document.getElementById('status-text').innerText = 'Card not recognised. Try again.';
            setTimeout(() => {
                document.getElementById('error-box').style.display = 'none';
                document.getElementById('status-text').innerText = 'Waiting for RFID card...';
                scanning = true;
            }, 3000);
        }
    });
}
document.addEventListener('keydown', e => { if (e.key === 'F1') { let r = prompt('Test RFID:'); if (r) handleScan(r); } });
function tick() { document.getElementById('clock').innerText = new Date().toLocaleString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit',day:'numeric',month:'short',year:'numeric'}); }
tick(); setInterval(tick,1000);
</script>
</body>
</html>
